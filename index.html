<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F3EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bon Aqua Ops">
  <title>Bon Aqua Ops</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-64.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./app.css?v=2.0.1">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="brand" id="topTitle">Bon Aqua Ops</div>
    <div class="top-actions">
      <button class="pill" id="outboxBtn" hidden aria-label="Outbox">
        <span class="dot"></span><span id="outboxCount">0</span>
      </button>
      <button class="pill ghost" id="specsBtn" aria-label="Farm Specs">Specs</button>
      <button class="pill ghost" id="whoBtn" hidden></button>
    </div>
  </header>

  <div class="offline-bar" id="offlineBar" hidden>Offline. Records are saved on the phone and send automatically.</div>

  <main id="view" class="view"></main>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>

  <div class="toast" id="toast" hidden></div>

  <script src="./queue.js?v=2.0.1"></script>
  <script type="module" src="./app.js?v=2.0.1"></script>
</body>
</html>
