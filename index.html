<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aquaculture Operations Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b1329; color: #ffffff; -webkit-tap-highlight-color: transparent; }
        .sunlight-card { background-color: #1c2541; border: 2px solid #3a506b; transition: all 0.15s ease; }
        .sunlight-card:active { background-color: #3a506b; border-color: #5bc0be; }
    </style>
</head>
<body class="flex flex-col min-h-screen font-sans antialiased">

    <header class="sticky top-0 z-50 bg-[#0b1329] border-b-2 border-[#1c2541] px-4 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black tracking-tight text-white uppercase">Abalone Ops</h1>
            <p class="text-xs font-bold text-[#5bc0be] tracking-widest uppercase">Master Control Hub</p>
        </div>
        <div id="network-status" class="flex items-center gap-2 bg-[#1c2541] px-3 py-1.5 rounded-full border border-[#3a506b]">
            <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full"></span>
            <span class="text-xs font-black text-emerald-400 uppercase tracking-wider">System Live</span>
        </div>
    </header>

    <main class="flex-1 p-4 space-y-4 pb-24 max-w-md mx-auto w-full">
        <section class="space-y-3">
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest px-1">Active Operational Nodes</h2>

            <a href="/water" data-prefetch="/water" class="ops-link sunlight-card flex items-center justify-between p-5 rounded-xl block">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-blue-500/10 rounded-lg border border-blue-500/30">
                        <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5l6.74-6.76z"></path></svg>
                    </div>
                    <div>
                        <h3 class="text-base font-black text-white tracking-wide uppercase">Water Quality</h3>
                        <p class="text-xs text-slate-400 font-medium">DO, Temp, & Salinity Logs</p>
                    </div>
                </div>
                <span class="text-xs font-black bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-2.5 py-1 rounded uppercase">Live</span>
            </a>

            <a href="/spawning" data-prefetch="/spawning" class="ops-link sunlight-card flex items-center justify-between p-5 rounded-xl block">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-purple-500/10 rounded-lg border border-purple-500/30">
                        <svg class="w-6 h-6 text-purple-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.656 48.656 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3"></path></svg>
                    </div>
                    <div>
                        <h3 class="text-base font-black text-white tracking-wide uppercase">Spawning Trials</h3>
                        <p class="text-xs text-slate-400 font-medium">Induction & Conditioning</p>
                    </div>
                </div>
                <span class="text-xs font-black bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-2.5 py-1 rounded uppercase">Live</span>
            </a>

            <a href="#" class="pointer-events-none opacity-40 sunlight-card flex items-center justify-between p-5 rounded-xl block">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-amber-500/10 rounded-lg border border-amber-500/30">
                        <svg class="w-6 h-6 text-amber-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                    <div>
                        <h3 class="text-base font-black text-slate-400 tracking-wide uppercase">HR Roster</h3>
                        <p class="text-xs text-slate-500 font-medium">Shift Deployments & Teams</p>
                    </div>
                </div>
                <span class="text-xs font-black bg-slate-500/20 border border-slate-500/30 text-slate-400 px-2.5 py-1 rounded uppercase">Testing</span>
            </a>
        </section>
    </main>

    <script>
        // Physical confirmation rumble for outdoor floor workers
        function triggerHaptic(ms) {
            if ('vibrate' in navigator) navigator.vibrate(ms);
        }

        // Monitors farm connectivity changes natively
        window.addEventListener('online', () => {
            document.getElementById('network-status').innerHTML = `<span class="w-2.5 h-2.5 bg-emerald-400 rounded-full"></span><span class="text-xs font-black text-emerald-400 uppercase tracking-wider">System Live</span>`;
        });
        window.addEventListener('offline', () => {
            document.getElementById('network-status').innerHTML = `<span class="w-2.5 h-2.5 bg-rose-500 rounded-full animate-pulse"></span><span class="text-xs font-black text-rose-500 uppercase tracking-wider">Offline Storage Mode</span>`;
            triggerHaptic([150, 100, 150]);
        });

        // Predictive Cache Pre-warming Engine
        document.querySelectorAll('[data-prefetch]').forEach(card => {
            card.addEventListener('touchstart', () => {
                triggerHaptic(45); // Snap touch confirmation rumble
                const path = card.getAttribute('data-prefetch');
                if (!document.querySelector(`link[href="${path}"]`)) {
                    const prefetchLink = document.createElement('link');
                    prefetchLink.rel = 'prefetch';
                    prefetchLink.href = path;
                    document.head.appendChild(prefetchLink);
                }
            }, { passive: true });
        });
    </script>
</body>
</html>
